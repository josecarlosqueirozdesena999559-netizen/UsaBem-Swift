name: 🚀 Build & Deploy to App Store (TestFlight)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Release to Apple App Store
    runs-on: macos-14

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: ⚙️ Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer

      - name: 💎 Set up Ruby & Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: 🔐 Install Apple Certificate & Provisioning Profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          db_password=$KEYCHAIN_PASSWORD

          security create-keychain -p "$db_password" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$db_password" $KEYCHAIN_PATH

          # Import public distribution certificate if provided
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.file
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH
          
          if file "$CERTIFICATE_PATH" | grep -q "PKCS"; then
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12
          else
            security import $CERTIFICATE_PATH -k $KEYCHAIN_PATH -A -t cert
          fi

          # Generate matching private key identity for iOS Distribution (Team 3YB4FZDQ82)
          openssl req -x509 -newkey rsa:2048 -keyout $RUNNER_TEMP/ios_dist.key -out $RUNNER_TEMP/ios_dist.crt -days 365 -nodes -subj "/CN=Apple Distribution: Jos Carlos Queiroz de Sena (3YB4FZDQ82)/OU=3YB4FZDQ82/O=Jos Carlos Queiroz de Sena/C=BR"
          openssl pkcs12 -export -out $RUNNER_TEMP/ios_dist.p12 -inkey $RUNNER_TEMP/ios_dist.key -in $RUNNER_TEMP/ios_dist.crt -passout pass:123456
          security import $RUNNER_TEMP/ios_dist.p12 -k $KEYCHAIN_PATH -P "123456" -A -t cert -f pkcs12

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$db_password" $KEYCHAIN_PATH || true

          # Install provisioning profile with exact UUID
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          PP_UUID="f5afae80-383a-40f7-aa87-9052c82e51a3"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o ~/Library/MobileDevice/Provisioning\ Profiles/$PP_UUID.mobileprovision
          echo "Provisioning Profile $PP_UUID installed successfully!"

      - name: 🚀 Run Fastlane Build & Deploy
        env:
          APP_STORE_CONNECT_API_KEY_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          cd fastlane
          bundle install
          bundle exec fastlane release_to_testflight