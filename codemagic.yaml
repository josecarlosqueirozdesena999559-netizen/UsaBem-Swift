workflows:
  ios-testflight:
    name: UsaBem iOS TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m1
    integrations:
      app_store_connect: Codemagic Apple
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: app.requisiplus.clientios
    scripts:
      - name: Initialize project structure
        script: |
          echo "Building UsaBem native Swift app for iOS..."
      - name: Build Xcode Archive & IPA
        script: |
          xcodebuild -project UsaBem.xcodeproj \
                     -scheme UsaBem \
                     -sdk iphoneos \
                     -configuration Release \
                     -archivePath $CM_BUILD_DIR/build/UsaBem.xcarchive \
                     archive
          xcodebuild -exportArchive \
                     -archivePath $CM_BUILD_DIR/build/UsaBem.xcarchive \
                     -exportOptionsPlist export_options.plist \
                     -exportPath $CM_BUILD_DIR/build
    artifacts:
      - $CM_BUILD_DIR/build/*.ipa
      - $CM_BUILD_DIR/build/*.xcarchive
    publishing:
      email:
        recipients:
          - dimsena910@gmail.com
      app_store_connect:
        auth: integration
        submit_to_testflight: true
